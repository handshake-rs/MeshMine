[package]
name = "meshmine-hns"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Exact Handshake header, proof-of-work, target, and Merkle primitives for MeshMine"

[dependencies]
blake2.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
sha3.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "verify-hsd-vectors"
path = "src/bin/verify_hsd_vectors.rs"
required-features = ["vector-verifier"]

[features]
default = []
vector-verifier = ["dep:hex", "dep:serde", "dep:serde_json"]

[dependencies.hex]
workspace = true
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true
