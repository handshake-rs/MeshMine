[workspace]
members = [
  "bins/meshmine-cored",
  "bins/meshmine-corelink-operatord",
  "bins/meshmine-gateway",
  "bins/meshmine-node",
  "bins/meshmine-operatord",
  "bins/meshmine-workd",
  "crates/meshmine-body",
  "crates/meshmine-committee-risk",
  "crates/meshmine-committee",
  "crates/meshmine-codec",
  "crates/meshmine-core-link",
  "crates/meshmine-crypto",
  "crates/meshmine-fast-path",
  "crates/meshmine-gateway",
  "crates/meshmine-handoff",
  "crates/meshmine-hns",
  "crates/meshmine-hsrd-bridge",
  "crates/meshmine-mpc-api",
  "crates/meshmine-network",
  "crates/meshmine-parent-oracle",
  "crates/meshmine-service",
  "crates/meshmine-settlement",
  "crates/meshmine-share",
  "crates/meshmine-sim",
  "crates/meshmine-storage",
  "crates/meshmine-types",
  "crates/meshmine-work",
]
exclude = ["hsrd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
ash = "0.38.0"
blake2 = "0.10.6"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
libc = "0.2.186"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
rand = "0.9.2"
rand_chacha = "0.9.0"
rcgen = "=0.13.2"
reed-solomon-erasure = "6.0.0"
redb = "4.1.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha3 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
# Consensus-adjacent accounting and sequence arithmetic must fail instead of
# silently wrapping merely because a production binary uses optimized code.
overflow-checks = true
